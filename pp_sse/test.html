<!DOCTYPE html>
<html>
<head>
    <title>SSE Text Streaming Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #output { 
            border: 1px solid #ccc; 
            padding: 10px; 
            height: 400px; 
            overflow-y: auto; 
            background: #f9f9f9;
        }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; }
        .status { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>SSE Text Streaming Test</h1>
    
    <div class="controls">
        <button onclick="startStream()">Start Streaming</button>
        <button onclick="stopStream()">Stop Streaming</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>
    
    <div class="status" id="status">Ready to start streaming...</div>
    <div id="output"></div>

    <script>
        let eventSource = null;
        let connectionId = null;

        function startStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            document.getElementById('status').textContent = 'Connecting...';
            document.getElementById('output').innerHTML = '';
            
            eventSource = new EventSource('http://localhost:8000/stream');
            
            // Named event "connected": the server sends our real connection ID first.
            eventSource.addEventListener('connected', function(event) {
                const info = JSON.parse(event.data);
                connectionId = info.connection_id;
                const resumed = info.resumed_after ? ` (resumed after #${info.resumed_after})` : '';
                document.getElementById('status').textContent = `Connected - streaming${resumed}...`;
            });

            // Unnamed events (no "event:" line) arrive here. event.lastEventId holds the "id:".
            eventSource.onmessage = function(event) {
                appendLine(`#${event.lastEventId} ${event.data}`);
            };

            eventSource.addEventListener('progress', function(event) {
                document.getElementById('status').textContent = `Streaming... ${JSON.parse(event.data).sent} sentences`;
            });

            // Named event "end": close ourselves, otherwise EventSource would auto-reconnect.
            eventSource.addEventListener('end', function(event) {
                const info = JSON.parse(event.data);
                document.getElementById('status').textContent = `Finished (${info.reason}, ${info.sent} sentences)`;
                eventSource.close();
                eventSource = null;
                connectionId = null;
            });

            // On a dropped connection the browser retries by itself (after "retry:" ms)
            // and sends Last-Event-ID, so the server resumes where we left off.
            eventSource.onerror = function() {
                if (eventSource && eventSource.readyState === EventSource.CONNECTING) {
                    document.getElementById('status').textContent = 'Connection lost - reconnecting...';
                }
            };
        }

        function appendLine(text) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.textContent = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        function stopStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                document.getElementById('status').textContent = 'Streaming stopped';
                
                // Call server endpoint to stop streaming
                if (connectionId) {
                    fetch(`http://localhost:8000/stop-stream/${connectionId}`, { method: 'POST' })
                      .then(response => response.json())
                      .then(data => console.log('Server response:', data))
                      .catch(error => console.error('Error stopping stream:', error));
                }
                connectionId = null;
            }
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
    </script>
</body>
</html>
